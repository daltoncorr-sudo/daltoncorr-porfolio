      <div class="nf-mark" aria-hidden="true"><span>4</span><span class="nf-eye"><i></i></span><span>4</span></div>
      <h1 class="nf-text">sorry, page not found.</h1>
      <p><a href="/" class="nf-home">go home?</a></p>
    </main>
    <script>
    /* The 0 is an eye looking for the missing page. It glances around on its
       own (CSS), and while you move the mouse it watches you instead. */
    (function () {
      var eye = document.querySelector('.nf-eye');
      if (!eye || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var pupil = eye.querySelector('i'), idle;
      window.addEventListener('pointermove', function (e) {
        var r = eye.getBoundingClientRect();
        var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        var d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 160);
        pupil.style.transform = 'translate(' + (dx / d * r.width * 0.2 * k) + 'px,' + (dy / d * r.height * 0.22 * k) + 'px)';
        eye.classList.add('is-following');
        clearTimeout(idle);
        idle = setTimeout(function () { eye.classList.remove('is-following'); pupil.style.transform = ''; }, 2500);
      });
    })();
    </script>
  </div>
