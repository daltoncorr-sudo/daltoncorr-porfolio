    <script src="/js/glass-bubble.js?v=74ca3c4f" defer></script>
    <script>
    /* A "404" drawn on a canvas, with Bencho's glass ball resting on it
       (js/glass-bubble.js). Drag it around. */
    window.addEventListener('DOMContentLoaded', function () {
      var main = document.querySelector('.notfound'), stage = main.querySelector('.nf-stage');
      var art = stage.querySelector('.nf-art'), glass = null;
      function draw() {
        var w = stage.clientWidth, h = Math.round(w * 0.5), dpr = Math.min(window.devicePixelRatio || 1, 2);
        art.width = w * dpr; art.height = h * dpr;
        art.style.width = w + 'px'; art.style.height = h + 'px';
        var g = art.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.fillStyle = '#F5F5F5'; g.fillRect(0, 0, w, h);
        g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = '600 ' + Math.round(h * 0.4) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif';
        g.fillText('404', w / 2, h * 0.54);
      }
      draw();
      if (window.GlassBubble) {
        glass = window.GlassBubble(stage, { picture: function () { return art; }, bounds: main, size: Math.round(stage.clientWidth * 0.4), start: { x: 0.56, y: 0.54 } });
      }
      var tick = false;
      window.addEventListener('resize', function () {
        if (tick) return; tick = true;
        requestAnimationFrame(function () { tick = false; draw(); if (glass) glass.refresh(); });
      });
    });
    </script>
  </div>
