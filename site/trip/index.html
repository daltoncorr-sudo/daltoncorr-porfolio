<style>
:root{--bg:#14213A;--ink:#F4EEE2;--muted:rgba(217,188,132,.8);--line:rgba(217,188,132,.3);--accent:#D9BC84;--warn:#F2A488}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Manrope",-apple-system,sans-serif;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left))}
form{width:100%;max-width:360px;display:grid;gap:14px}
.k{font:600 12px "Manrope",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

input[type=password]:focus{border-color:var(--accent)}
button{font:600 13px "Manrope",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#14213A;background:var(--accent);border:0;border-radius:12px;padding:14px;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:0}

async function open_(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return new TextDecoder().decode(pt);
}
