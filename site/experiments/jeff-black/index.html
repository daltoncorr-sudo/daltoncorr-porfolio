:root{--bg:#0A0909;--ink:#EDE6D9;--ink2:#DAD3C7;--muted:#ADA599;--line:rgba(237,230,217,.13);--gold:#C8A96A;--gold2:#E6CD95;
  --serif:"Bodoni Moda","Didot","Bodoni 72",serif;--sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--e:cubic-bezier(.16,1,.3,1);--g:clamp(18px,4vw,56px);
  --cw:clamp(138px,17vw,236px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 46%,rgba(126,26,30,.30),transparent 72%),radial-gradient(40% 30% at 50% 0%,rgba(230,205,149,.07),transparent 80%),var(--bg)}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px 24px;padding:22px var(--g);z-index:3}
.top p{margin:0}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:500;font-size:21px;font-variation-settings:"opsz" 18}
.brand svg{width:30px;height:28px;color:var(--gold)}
.meta{color:var(--muted);font-size:16px}
.hall{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px var(--g) 70px}
h1{font-family:var(--serif);font-weight:500;margin:0;line-height:.98;letter-spacing:-.012em;font-variation-settings:"opsz" 28;font-size:clamp(52px,7.4vw,118px)}
h1 em{font-style:italic;color:var(--gold2)}
.sub{margin:16px 0 0;color:var(--ink2);font-size:clamp(18px,1.4vw,21px)}
.deal{display:flex;justify-content:center;gap:clamp(26px,6vw,96px);margin-top:clamp(34px,6vh,64px);perspective:1400px}
.pick{display:flex;flex-direction:column;align-items:center;gap:22px;color:var(--ink);text-decoration:none;outline:none;-webkit-tap-highlight-color:transparent;
  transition:opacity .7s var(--e),transform .9s var(--e),filter .7s}
.card{position:relative;display:block;width:var(--cw);aspect-ratio:5/7;transform-style:preserve-3d;
  transform:translateY(var(--lift,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .5s var(--e)}
.pick:nth-child(1) .card{animation:float 6s ease-in-out infinite}
.pick:nth-child(2) .card{animation:float 6s ease-in-out -3s infinite}
@keyframes float{50%{translate:0 -8px}}
.card::before{content:"";position:absolute;left:8%;right:8%;bottom:-9%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent);transform:translateZ(-40px);filter:blur(4px)}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s var(--e)}
.side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6.4%/4.6%;overflow:hidden;box-shadow:0 0 0 1px rgba(200,169,106,.25),0 26px 50px rgba(0,0,0,.55)}
.side img{display:block;width:100%;height:100%}
.face{transform:rotateY(180deg)}
.shine{position:absolute;inset:0;border-radius:6.4%/4.6%;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,236,190,.28) 48%,transparent 60%) no-repeat;background-size:250% 100%;background-position:120% 0;transition:background-position 1s var(--e);backface-visibility:hidden}
.lbl{font-family:var(--serif);font-weight:500;font-size:clamp(21px,2.1vw,30px);line-height:1.15;font-variation-settings:"opsz" 18;transition:color .3s;max-width:9em}
.pick:hover .lbl,.pick:focus-visible .lbl{color:var(--gold2)}
.pick:hover .shine,.pick:focus-visible .shine{background-position:-30% 0}
.pick:hover .card,.pick:focus-visible .card{--lift:-12px}
.pick:focus-visible .side{box-shadow:0 0 0 2px var(--gold2),0 26px 50px rgba(0,0,0,.55)}
.pick.flipped .flip{transform:rotateY(180deg)}
.pick.chosen .card{--sc:1.1;--lift:-14px;animation:none}
.pick.chosen .side{box-shadow:0 0 0 1px rgba(230,205,149,.6),0 0 60px rgba(230,190,110,.45),0 26px 50px rgba(0,0,0,.55)}
.pick.away{opacity:0;transform:translateY(26px) scale(.94);filter:blur(3px);pointer-events:none}
.casting .sub,.casting h1{opacity:.35;transition:opacity .8s}
footer{position:fixed;left:0;right:0;bottom:0;padding:18px var(--g);color:var(--muted);font-size:15px;text-align:center;z-index:2}
footer p{margin:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
/* the wand */
.wand{position:fixed;left:0;top:0;width:26px;height:150px;pointer-events:none;z-index:6;opacity:0;transform-origin:13px 6px;transition:opacity .25s}
.wand.on{opacity:1}
.wand svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(6px 10px 8px rgba(0,0,0,.55))}
@media (hover:hover) and (pointer:fine){html.wanded,html.wanded *{cursor:none!important}}

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wand" id="wand" aria-hidden="true"><svg viewBox="0 0 26 150">
  <defs><linearGradient id="shaft" x1="0" x2="1"><stop offset="0" stop-color="#050505"/><stop offset=".38" stop-color="#3a3632"/><stop offset=".55" stop-color="#121110"/><stop offset="1" stop-color="#020202"/></linearGradient>
  <linearGradient id="tipg" x1="0" x2="1"><stop offset="0" stop-color="#cfc7b8"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#bdb5a6"/></linearGradient></defs>
  <rect x="8" y="6" width="10" height="20" rx="2.5" fill="url(#tipg)"/>
  <rect x="8" y="24" width="10" height="104" fill="url(#shaft)"/>
  <rect x="8" y="126" width="10" height="20" rx="2.5" fill="url(#tipg)"/>
  <rect x="7.4" y="24.5" width="11.2" height="1.4" fill="#C8A96A"/><rect x="7.4" y="125" width="11.2" height="1.4" fill="#C8A96A"/>
</svg></div>
<div class="curtain" id="curtain" aria-hidden="true"><div class="c l"></div><div class="c r"></div><div class="mark"><svg viewBox="0 0 200 236"><use href="#gent"/></svg></div></div>

<script>
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  var cv = document.getElementById('fx'), g = cv.getContext('2d'), dpr = 1, W = 0, H = 0;
  function size() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener('resize', size);

  // ---------- gold sparkles ----------
  var P = [], MAX = 900;
  function spark(x, y, vx, vy, life, r, drift) {
    if (P.length > MAX) P.shift();
    P.push({ x: x, y: y, vx: vx, vy: vy, t: 0, life: life, r: r, drift: drift || 0, s: Math.random(), w: Math.random() < 0.22 });
  }
  function burst(x, y, n, sp) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = (0.25 + Math.random()) * (sp || 420);
      spark(x, y, Math.cos(a) * v, Math.sin(a) * v - 60, 0.7 + Math.random() * 1.1, 1.4 + Math.random() * 3.2, 1);
    }
  }
  function draw(p, k) {
    var a = Math.sin(Math.PI * Math.min(1, k)) * (0.6 + 0.4 * Math.sin(p.t * 22 + p.s * 40)), r = p.r * (1 - k * 0.4);
    if (a <= 0) return;
    var col = p.w ? '255,250,235' : '255,212,140';
    var gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 3.2);
    gr.addColorStop(0, 'rgba(' + col + ',' + (0.55 * a) + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, r * 3.2, 0, 7); g.fill();
    g.fillStyle = 'rgba(' + col + ',' + a + ')';
    g.beginPath(); g.moveTo(p.x - r * 3, p.y); g.lineTo(p.x, p.y - r * 0.35); g.lineTo(p.x + r * 3, p.y); g.lineTo(p.x, p.y + r * 0.35); g.fill();
    g.beginPath(); g.moveTo(p.x, p.y - r * 3); g.lineTo(p.x + r * 0.35, p.y); g.lineTo(p.x, p.y + r * 3); g.lineTo(p.x - r * 0.35, p.y); g.fill();
  }
  // a little ambient dust, drifting up through the light
  var dust = []; for (var i = 0; i < 46; i++) dust.push({ x: Math.random(), y: Math.random(), s: Math.random(), v: 0.006 + Math.random() * 0.012 });

  // ---------- the wand ----------
  var wand = document.getElementById('wand'), wx = -200, wy = -200, lx = 0, ly = 0, ang = -34, angT = -34, flick = 0, over = false, acc = 0;
  if (fine) document.documentElement.classList.add('wanded');
  addEventListener('pointermove', function (e) {
    if (!fine || e.pointerType !== 'mouse') return;
    wx = e.clientX; wy = e.clientY; wand.classList.add('on');
    var d = Math.hypot(wx - lx, wy - ly); acc += d; lx = wx; ly = wy;
    var step = over ? 7 : 13;
    while (acc > step) { acc -= step; spark(wx + (Math.random() - .5) * 4, wy + (Math.random() - .5) * 4, (Math.random() - .5) * 40, 10 + Math.random() * 30, 0.45 + Math.random() * 0.6, 0.9 + Math.random() * (over ? 2.4 : 1.6), 1); }
  }, { passive: true });
  document.addEventListener('pointerleave', function () { wand.classList.remove('on'); });
  addEventListener('blur', function () { wand.classList.remove('on'); });

  // ---------- the cards ----------
  var picks = [].slice.call(document.querySelectorAll('.pick')), busy = false;
  picks.forEach(function (a) {
    var card = a.querySelector('.card');
    a.addEventListener('pointerenter', function () { over = true; });
    a.addEventListener('pointerleave', function () { over = false; card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });
    a.addEventListener('pointermove', function (e) {
      if (busy || e.pointerType !== 'mouse') return;
      var r = card.getBoundingClientRect(), u = (e.clientX - r.left) / r.width - 0.5, v = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--ry', (u * 16).toFixed(2) + 'deg'); card.style.setProperty('--rx', (-v * 12).toFixed(2) + 'deg');
    });
    a.addEventListener('click', function (e) {
      if (busy) { e.preventDefault(); return; }
      e.preventDefault();
      var r = card.getBoundingClientRect(), x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top + r.height / 2;
      if (e.detail === 0) { x = r.left + r.width / 2; y = r.top + r.height / 2; }   // keyboard
      cast(a, card, x, y);
    });
  });
  function cast(a, card, x, y) {
    busy = true; over = false; document.body.classList.add('casting');
    card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg');
    if (reduce) { a.classList.add('chosen'); setTimeout(function () { location.href = a.href; }, 250); return; }
    flick = 1; burst(x, y, 150, 460);
    a.classList.add('chosen');
    picks.forEach(function (b) { if (b !== a) b.classList.add('away'); });
    setTimeout(function () { a.classList.add('flipped'); }, 140);
    // gold swirls around the card while it turns
    var r = card.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, R = Math.max(r.width, r.height) * 0.62, t0 = performance.now();
    (function swirl() {
      var k = (performance.now() - t0) / 1000; if (k > 1.15) return;
      for (var i = 0; i < 6; i++) {
        var th = k * 9 + i * Math.PI / 3 + Math.random() * 0.4, rr = R * (1.05 - k * 0.25);
        spark(cx + Math.cos(th) * rr * 0.78, cy + Math.sin(th) * rr, -Math.sin(th) * 160, Math.cos(th) * 160 - 30, 0.6 + Math.random() * 0.5, 1.2 + Math.random() * 2.4, 1);
      }
      requestAnimationFrame(swirl);
    })();
    setTimeout(function () { burst(cx, cy, 120, 380); }, 900);
    setTimeout(function () { document.getElementById('curtain').classList.add('shut'); }, 1050);
    setTimeout(function () { location.href = a.href; }, 2350);
  }
  // coming back with the back button: start fresh
  addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    busy = false; document.body.classList.remove('casting'); document.getElementById('curtain').classList.remove('shut');
    picks.forEach(function (b) { b.classList.remove('chosen', 'away', 'flipped'); });
  });

  // ---------- frame ----------
  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.05); last = now;
    g.clearRect(0, 0, W, H); g.globalCompositeOperation = 'lighter';
    if (!reduce) dust.forEach(function (d) {
      d.y -= d.v * dt; if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
      var x = d.x * W + Math.sin(now / 1800 + d.s * 30) * 18, y = d.y * H, a = 0.18 + 0.5 * Math.pow(Math.max(0, Math.sin(now / 900 * (0.4 + d.s) + d.s * 50)), 6);
      var gr = g.createRadialGradient(x, y, 0, x, y, 3 + d.s * 3); gr.addColorStop(0, 'rgba(255,220,160,' + a * 0.55 + ')'); gr.addColorStop(1, 'rgba(255,220,160,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, 3 + d.s * 3, 0, 7); g.fill();
    });
    for (var i = P.length - 1; i >= 0; i--) {
      var p = P[i]; p.t += dt; var k = p.t / p.life;
      if (k >= 1) { P.splice(i, 1); continue; }
      p.vx *= Math.pow(0.18, dt); p.vy = p.vy * Math.pow(0.18, dt) + 40 * dt * p.drift; p.x += p.vx * dt; p.y += p.vy * dt;
      draw(p, k);
    }
    g.globalCompositeOperation = 'source-over';
    // wand: follows the pointer; leans in over a card; flicks when it casts
    if (fine) {
      angT = over ? -24 : -34; flick = Math.max(0, flick - dt * 2.6);
      ang += (angT - ang) * Math.min(1, dt * 10);
      var f = Math.sin(flick * Math.PI) * -26;
      wand.style.transform = 'translate(' + (wx - 13) + 'px,' + (wy - 6) + 'px) rotate(' + (ang + f) + 'deg)';
      if (over && Math.random() < dt * 14) spark(wx, wy, (Math.random() - .5) * 30, -10 - Math.random() * 20, 0.5, 1 + Math.random() * 2, 0.5);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
