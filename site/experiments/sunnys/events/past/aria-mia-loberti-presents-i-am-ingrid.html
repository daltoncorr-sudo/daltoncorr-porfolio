    if (raw) { await open(await crypto.subtle.importKey('raw', u8(raw), 'AES-GCM', false, ['decrypt'])); return; }
  } catch (e) { try { localStorage.removeItem(K); } catch (_) {} }
  document.body.classList.add('show');
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const pw = document.getElementById('pw').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(S), iterations: N, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      await open(key);
      try { const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key)); localStorage.setItem(K, btoa(String.fromCharCode(...raw))); } catch (_) {}
    } catch (e) { document.getElementById('e').textContent = 'That password didn’t work. Please try again.'; }
  });
})();
</script>
