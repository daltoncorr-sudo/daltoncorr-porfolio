name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Force Node.js 24 for all JS actions ahead of the June 2 2026 default flip.
  # GitHub deprecated Node 20 actions; this opts us in across all checkout/pages/deploy actions
  # without having to bump each action version individually. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # Regenerate cache-busting params from content hashes + build sitemap.
      # Source files stay clean; deploy artifact gets hashed refs automatically.
      - name: Bump cache refs + build sitemap
        run: |
          python3 scripts/bump_cache.py
          python3 scripts/build_sitemap.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
